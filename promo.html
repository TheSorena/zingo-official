<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تیزر زینگو | معرفی برنامه فیلم و سریال Zingo</title>
<meta name="description" content="تیزر تبلیغاتی برنامه زینگو (Zingo) — برنامه فیلم و سریال اندروید با پخش آنلاین، زیرنویس فارسی و دانلود پرسرعت.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#FFF3E6">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preload" href="/assets/fonts/Pinar-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/assets/fonts/Pinar-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" as="image" href="/assets/screen1.jpg" type="image/jpeg">
<link rel="stylesheet" href="/promo.css">
</head>
<body>
<div class="ad" id="ad" aria-label="تیزر تبلیغاتی زینگو">

  <!-- نوار سگمنت‌ها مثل استوری -->
  <div class="segs" id="segs" aria-hidden="true">
    <span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span>
  </div>

  <!-- کنترل‌ها -->
  <div class="tools">
    <a class="tool" href="/" aria-label="بازگشت به صفحه دانلود">⌂</a>
    <button class="tool sound-off" id="soundBtn" type="button">🔇 با صدا ببین</button>
    <button class="tool" id="replayBtn" type="button" aria-label="پخش دوباره">↻</button>
  </div>

  <!-- صحنه اصلی: گوشی + کپشن -->
  <main class="stage" id="stage">
    <div class="caption" id="caption">
      <p class="hook" id="capHook"></p>
      <h1 id="capTitle"></h1>
      <p class="sub" id="capSub"></p>
      <div class="badges" id="capBadges"></div>
    </div>
    <div class="phone" id="phone">
      <div class="notch"></div>
      <div class="screen"><img id="screenImg" src="/assets/screen1.jpg" alt="نمای برنامه زینگو" width="240" height="533" fetchpriority="high"></div>
      <div class="taps" id="taps"></div>
      <div class="flash" id="flash"></div>
    </div>
  </main>

  <!-- اندکارت -->
  <section class="endcard" id="endcard" aria-label="دانلود زینگو">
    <img class="app-icon" src="/assets/logo.png" alt="آیکون زینگو" width="104" height="117">
    <h2>زینگو <span>Zingo</span></h2>
    <p class="stars" aria-label="امتیاز 4.8 از 5">★★★★★ <b>۴.۸</b></p>
    <p class="end-sub">برنامه فیلم و سریال • رایگان • ۳.۹ مگابایت</p>
    <a class="install" href="/downloads/Zingo-v1.0.7.apk" download="Zingo-v1.0.7.apk">نصب رایگان<small>v1.0.7 • اندروید ۷ به بالا</small></a>
    <div class="end-row">
      <button class="mini" id="replayBtn2" type="button">↻ دیدن دوباره تیزر</button>
      <a class="mini" href="/">صفحه دانلود</a>
    </div>
  </section>

</div>
<script src="/promo.js" defer></script>
</body>
</html>
